name: Compilar app Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: "versionName de la app"
        value: ${{ jobs.apk.outputs.version }}

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versión
        id: ver
        run: echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Llave de firma (si existe en los secretos)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/release.jks; echo "Se firma con la llave de los secretos"; else echo "Se firma con la llave de desarrollo"; fi

      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          chmod +x gradlew
          [ -n "$ANDROID_KEYSTORE_PASS" ] || unset ANDROID_KEYSTORE_PASS
          [ -n "$ANDROID_KEY_ALIAS" ] || unset ANDROID_KEY_ALIAS
          [ -n "$ANDROID_KEY_PASS" ] || unset ANDROID_KEY_PASS
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/NumpadMacros-Android-${{ steps.ver.outputs.version }}.apk"
          (cd ../dist && sha256sum *.apk)

      - uses: actions/upload-artifact@v4
        with:
          name: NumpadMacros-Android
          path: dist/*.apk
          if-no-files-found: error
