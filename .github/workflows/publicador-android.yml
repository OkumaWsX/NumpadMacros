name: Compilar Publicador Android

on:
  push:
    branches: [main]
    paths:
      - "tools/publicador-android/**"
      - ".github/workflows/publicador-android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/publicador-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versión
        id: ver
        run: echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Llave de firma (si existe en los secretos)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/release.jks; echo "Se firma con la llave de los secretos"; else echo "Se firma con la llave de desarrollo"; fi

      - name: Pruebas y compilar APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          chmod +x gradlew
          [ -n "$ANDROID_KEYSTORE_PASS" ] || unset ANDROID_KEYSTORE_PASS
          [ -n "$ANDROID_KEY_ALIAS" ] || unset ANDROID_KEY_ALIAS
          [ -n "$ANDROID_KEY_PASS" ] || unset ANDROID_KEY_PASS
          set -o pipefail
          if ! ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee gradle.log; then
            { grep -E "^e: |AAPT: error|FAILED$|Exception" gradle.log; grep -A4 "What went wrong" gradle.log | grep -v "^> Task"; } | head -12 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Publicador-NumpadMacros-Android-${{ steps.ver.outputs.version }}.apk"
          (cd dist && sha256sum *.apk)

      - uses: actions/upload-artifact@v4
        with:
          name: Publicador-Android
          path: tools/publicador-android/dist/*.apk
          if-no-files-found: error
