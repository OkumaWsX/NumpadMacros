# Compila el Estudio de Temas (programa aparte) para Windows (instalador y portátil),
# Linux y macOS. Corre cuando cambia su código o el formato .npt, a mano desde Actions,
# y lo llama «Publicar versión» para incluirlo en cada Release.
name: Compilar Estudio de Temas

on:
  push:
    branches: [main]
    paths: ["tools/estudio/**", "npm/npt.py", "npm/config.py", "npm/desktop_linux.py", "docs/temas/temas.json", "tests/test_npt.py",
            "tests/test_estudio.py", ".github/workflows/estudio.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: EstudioTemas-Windows
          - os: ubuntu-22.04          # glibc antiguo: funciona en más distribuciones
            name: EstudioTemas-Linux
          - os: macos-14              # Apple Silicon
            name: EstudioTemas-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/estudio/requirements.txt pyinstaller==6.22.3

      - name: Pruebas
        shell: bash
        run: python -m unittest tests.test_npt tests.test_estudio -v

      - name: Compilar
        shell: bash
        working-directory: tools/estudio
        run: pyinstaller --noconfirm Estudio.spec

      - name: Probar el programa compilado (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          export NPT_ESTUDIO_DIR="$RUNNER_TEMP/estudio"
          xvfb-run -a timeout 90 tools/estudio/dist/EstudioTemas-NumpadMacros --probar > out.txt 2>&1 || {
            cat out.txt "$NPT_ESTUDIO_DIR/error.log" 2>/dev/null | tail -25 | sed 's/^/::error::/'; exit 1; }

      - name: Probar el programa compilado (macOS)
        if: runner.os == 'macOS'
        run: |
          export NPT_ESTUDIO_DIR="$RUNNER_TEMP/estudio"
          timeout 90 "tools/estudio/dist/Estudio de Temas.app/Contents/MacOS/EstudioTemas-NumpadMacros" --probar > out.txt 2>&1 || {
            cat out.txt "$NPT_ESTUDIO_DIR/error.log" 2>/dev/null | tail -25 | sed 's/^/::error::/'; exit 1; }

      - name: Probar el programa compilado (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NPT_ESTUDIO_DIR = "$env:RUNNER_TEMP\estudio"
          $p = Start-Process -FilePath "tools\estudio\dist\EstudioTemas-NumpadMacros.exe" -ArgumentList "--probar" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Error "El programa no se cerró solo"; exit 1 }
          if ($p.ExitCode -ne 0) { Get-Content "$env:NPT_ESTUDIO_DIR\error.log" -ErrorAction SilentlyContinue; exit 1 }

      - name: Instalador y portátil (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import re; t=open('tools/estudio/estudio.py', encoding='utf-8').read(); print(re.search('^VERSION = .(.+?).$', t, re.M).group(1))"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer\EstudioTemas.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "dist-installer\EstudioTemas-Setup-$version.exe" "${{ matrix.name }}-Setup.exe"
          Compress-Archive -Path tools/estudio/dist/EstudioTemas-NumpadMacros.exe, tools/estudio/LEEME.md -DestinationPath "${{ matrix.name }}-portable.zip"

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/EstudioTemas
          cp tools/estudio/dist/EstudioTemas-NumpadMacros tools/estudio/LEEME.md assets/icon.png pkg/EstudioTemas/
          chmod +x pkg/EstudioTemas/EstudioTemas-NumpadMacros
          tar -C pkg -czf "${{ matrix.name }}.tar.gz" EstudioTemas

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "tools/estudio/dist/Estudio de Temas.app"
          ditto -c -k --keepParent "tools/estudio/dist/Estudio de Temas.app" "${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}-Setup.exe
            ${{ matrix.name }}-portable.zip
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.tar.gz
          if-no-files-found: error
