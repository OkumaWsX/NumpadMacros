# Compila Numpad Macros para Windows, Linux y macOS (lo usan «Compilar app» y
# «Publicar versión»). No se ejecuta solo: lo llaman los otros dos.
name: Compilar (reutilizable)

on:
  workflow_call:
    inputs:
      preparado:
        description: "Usar los archivos del paso «preparar» (al publicar una versión)"
        type: boolean
        default: false
      beta:
        description: "Versión de prueba: la carpeta de los paquetes lleva «-beta»"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: NumpadMacros-Windows
          - os: ubuntu-22.04          # glibc antiguo: funciona en más distribuciones
            name: NumpadMacros-Linux
          - os: macos-14              # Apple Silicon
            name: NumpadMacros-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Al publicar: usar el número de versión y el CHANGELOG ya preparados
      - name: Usar la versión preparada
        if: inputs.preparado
        uses: actions/download-artifact@v4
        with:
          name: preparado
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pillow   # pillow: convierte el icono

      - name: Pruebas
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Incluir interception.dll (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o icp.zip https://github.com/oblitum/Interception/releases/download/v1.0.1/Interception.zip
          unzip -q icp.zip -d icp
          cp icp/Interception/library/x64/interception.dll .
          mkdir -p third_party
          cp "icp/Interception/command line installer/install-interception.exe" third_party/
          cp "icp/Interception/licenses/non-commercial-usage/LGPL 3.0.txt" third_party/LGPL-3.0.txt

      - name: Compilar
        shell: bash
        run: pyinstaller --noconfirm NumpadMacros.spec

      # Al descomprimir, la carpeta dice la versión (y «-beta» si es de prueba)
      - name: Nombre de la carpeta
        shell: bash
        run: |
          v=$(python -c "import npm; print(npm.__version__)")
          folder="NumpadMacros-$v"
          if [ "${{ inputs.beta }}" = "true" ]; then folder="$folder-beta"; fi
          echo "FOLDER=$folder" >> "$GITHUB_ENV"
          echo "Carpeta: $folder"

      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import npm; print(npm.__version__)"
          # la última versión publicada del Estudio de Temas (sus propias Releases «estudio-v…»):
          # el instalador la ofrece y la descarga. Sin conexión con la API, la de estudio.py.
          $env:GH_TOKEN = "${{ github.token }}"
          $tag = gh api "repos/${{ github.repository }}/releases?per_page=30" --jq '[.[] | select((.draft or .prerelease) | not) | select(.tag_name | startswith("estudio-v"))][0].tag_name' 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $tag) {
            $tag = "estudio-v" + (Select-String -Path tools/estudio/estudio.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          }
          $estudio = $tag -replace '^estudio-v', ''
          Write-Host "Estudio de Temas para el instalador: $estudio"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" "/DEstudioVersion=$estudio" installer\NumpadMacros.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "dist-installer\NumpadMacros-Setup-$version.exe" "NumpadMacros-Windows-Setup.exe"
          # versión portátil (sin instalar), por si alguien la prefiere
          Copy-Item LEEME.md dist/NumpadMacros/
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item -Recurse dist/NumpadMacros "pkg/$env:FOLDER"
          Compress-Archive -Path "pkg/$env:FOLDER" -DestinationPath "${{ matrix.name }}-portable.zip"

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "pkg/$FOLDER"
          cp dist/NumpadMacros instalar_linux.sh permisos_linux.sh LEEME.md assets/icon.png "pkg/$FOLDER/"
          chmod +x "pkg/$FOLDER"/*.sh "pkg/$FOLDER/NumpadMacros"
          tar -C pkg -czf "${{ matrix.name }}.tar.gz" "$FOLDER"

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "dist/Numpad Macros.app"
          mkdir -p "pkg/$FOLDER"
          ditto "dist/Numpad Macros.app" "pkg/$FOLDER/Numpad Macros.app"
          cp LEEME.md "pkg/$FOLDER/"
          ditto -c -k --keepParent "pkg/$FOLDER" "${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}-portable.zip
            ${{ matrix.name }}-Setup.exe
            ${{ matrix.name }}.tar.gz
          if-no-files-found: error
