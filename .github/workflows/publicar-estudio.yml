# Publica una versión nueva del Estudio de Temas (programa aparte de Numpad Macros, con su
# propio número de versión).
#
# Cómo usarlo: pestaña Actions → «Publicar Estudio de Temas» → «Run workflow».
#
# 1. preparar:  toma el número de tools/estudio/estudio.py (VERSION) y las novedades de
#               tools/estudio/CHANGELOG.md («Sin publicar» o la sección de esa versión).
# 2. compilar:  pruebas + Windows (instalador y portátil), Linux y macOS.
# 3. publicar:  solo si todo salió bien: crea la etiqueta estudio-vX.Y.Z y la Release
#               «Estudio de Temas X.Y.Z» con sus huellas SHA256. No se marca como «la última»
#               del repositorio (--latest=false) y, por si GitHub la recalcula, al final se vuelve a
#               poner en la última versión estable de Numpad Macros: «Latest» siempre es de la app.
#               Si «Anunciar en mi Discord» está marcado, avisa en el canal del webhook guardado en el
#               secreto DISCORD_WEBHOOK_ESTUDIO (si falla, la versión igual queda publicada).
#
# «Privado (borrador)», marcado por defecto: la Release queda como borrador, que solo ve el dueño
# del repositorio (para descargar y probar). No crea la etiqueta ni toca el historial. Cada vez que
# se corre, reemplaza el borrador anterior. Para publicarla de verdad, córrelo sin marcarlo.
name: Publicar Estudio de Temas

on:
  workflow_dispatch:
    inputs:
      privado:
        description: "Privado (borrador): solo tú lo ves, para probar antes de publicar"
        type: boolean
        default: true
      beta:
        description: "Versión de prueba (beta)"
        type: boolean
        default: false
      discord:
        description: "Anunciar en mi Discord (solo al publicar de verdad)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar-estudio
  cancel-in-progress: false

jobs:
  preparar:
    name: Preparar
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Número y novedades
        id: prep
        shell: python
        run: |
          import datetime, os, re, subprocess, sys
          src = open("tools/estudio/estudio.py", encoding="utf-8").read()
          ver = re.search(r'^VERSION = "([^"]+)"', src, re.M).group(1)
          if subprocess.run(["git", "rev-parse", "-q", "--verify", f"refs/tags/estudio-v{ver}"]).returncode == 0:
              print(f"::error::Ya existe estudio-v{ver}. Sube VERSION en tools/estudio/estudio.py.")
              sys.exit(1)
          log = open("tools/estudio/CHANGELOG.md", encoding="utf-8").read()
          parts = re.split(r"^## ", log, flags=re.M)
          def body(title_re):
              for p in parts[1:]:
                  head, _, rest = p.partition("\n")
                  if re.match(title_re, head):
                      return rest.strip()
              return ""
          notes = body(r"\[Sin publicar\]") or body(re.escape(f"[{ver}]"))
          if not notes:
              print("::error::tools/estudio/CHANGELOG.md no tiene novedades para esta versión.")
              sys.exit(1)
          today = datetime.date.today().isoformat()
          if body(r"\[Sin publicar\]"):
              # «Sin publicar» pasa a ser la versión (y se deja un «Sin publicar» vacío arriba)
              log = log.replace("## [Sin publicar]\n", f"## [Sin publicar]\n\n## [{ver}] - {today}\n", 1)
          log = re.sub(rf"^## \[{re.escape(ver)}\] - pendiente$", f"## [{ver}] - {today}", log, flags=re.M)
          open("tools/estudio/CHANGELOG.md", "w", encoding="utf-8").write(log)
          open("notas.md", "w", encoding="utf-8").write(
              notes + "\n\n---\nPrograma aparte de Numpad Macros para crear temas `.npt`. "
              "[Historial completo](https://github.com/" + os.environ["GITHUB_REPOSITORY"]
              + "/blob/main/tools/estudio/CHANGELOG.md)\n")
          readme = open("README.md", encoding="utf-8").read()
          readme = re.sub(r"releases/download/estudio-v[0-9.]+/", f"releases/download/estudio-v{ver}/", readme)
          open("README.md", "w", encoding="utf-8").write(readme)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={ver}\n")
      - uses: actions/upload-artifact@v4
        with:
          name: estudio-preparado
          path: |
            tools/estudio/CHANGELOG.md
            README.md
            notas.md
          if-no-files-found: error

  compilar:
    name: Compilar
    needs: preparar
    uses: ./.github/workflows/estudio.yml

  publicar:
    name: Publicar
    needs: [preparar, compilar]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preparar.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: estudio-preparado
          path: prep
      - uses: actions/download-artifact@v4
        with:
          pattern: EstudioTemas-*
          path: out
          merge-multiple: true

      - name: Huellas de seguridad (SHA256SUMS.txt)
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Borrador anterior (si hay)
        run: |
          # un borrador de esta versión se reemplaza (al probar de nuevo o al publicar de verdad)
          if [ "$(gh release view "estudio-v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "estudio-v$VERSION" --yes
            echo "Borrador anterior eliminado."
          fi

      - name: Guardar las novedades y crear la etiqueta
        if: ${{ !inputs.privado }}
        run: |
          cp prep/tools/estudio/CHANGELOG.md tools/estudio/CHANGELOG.md
          cp prep/README.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/estudio/CHANGELOG.md README.md
          git commit -m "Estudio de Temas $VERSION" || echo "Sin cambios que guardar"
          ok=""
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          if [ -z "$ok" ]; then echo "::error::No pude guardar las novedades en main."; exit 1; fi
          git tag -a "estudio-v$VERSION" -m "Estudio de Temas $VERSION"
          git push origin "estudio-v$VERSION"

      - name: Crear la Release (borrador privado)
        if: ${{ inputs.privado }}
        run: |
          flags="--draft --latest=false --target $GITHUB_SHA"
          if [ "${{ inputs.beta }}" = "true" ]; then flags="$flags --prerelease"; fi
          gh release create "estudio-v$VERSION" out/* \
            --title "Estudio de Temas $VERSION (borrador)" \
            --notes-file prep/notas.md $flags
          url=$(gh release view "estudio-v$VERSION" --json url --jq .url)
          echo "## Borrador privado del Estudio de Temas $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Solo tú lo ves. Descarga los archivos para probar: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Cuando estés conforme, vuelve a correr este workflow sin marcar «Privado»." >> "$GITHUB_STEP_SUMMARY"

      - name: Crear la Release (pública)
        if: ${{ !inputs.privado }}
        run: |
          flags="--latest=false"
          if [ "${{ inputs.beta }}" = "true" ]; then flags="$flags --prerelease"; fi
          gh release create "estudio-v$VERSION" out/* \
            --title "Estudio de Temas $VERSION" \
            --notes-file prep/notas.md $flags
          echo "## ✓ Estudio de Temas $VERSION publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/tag/estudio-v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Dejar «Latest» en Numpad Macros
        # Las Releases del Estudio se crean con --latest=false, pero GitHub puede volver a calcular la
        # «última» del repositorio con su regla antigua (la más reciente que no sea beta), por ejemplo al
        # borrar un borrador. Entonces la «Latest» quedaba en el Estudio y los enlaces «releases/latest»
        # llevaban al Estudio. Aquí se vuelve a poner en la última vX.Y.Z estable de Numpad Macros.
        if: ${{ always() }}
        continue-on-error: true
        run: |
          app=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last // empty')
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$app" ] && [ "$latest" != "$app" ]; then
            gh release edit "$app" --latest
            echo "«Latest» vuelve a ser Numpad Macros $app (estaba en ${latest:-ninguna})."
          else
            echo "«Latest»: ${latest:-ninguna} (sin cambios)."
          fi

      - name: Anunciar en Discord
        if: ${{ !inputs.privado && inputs.discord }}
        # si el anuncio falla, la versión igual queda publicada
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ESTUDIO }}
        run: |
          beta=""
          [ "${{ inputs.beta }}" = "true" ] && beta="--beta"
          python3 tools/estudio/anunciar_discord.py "$VERSION" --notas prep/notas.md $beta
