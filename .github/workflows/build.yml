# Revisa y compila la app en Windows, Linux y macOS cada vez que cambia el código.
# (Para publicar una versión se usa «Publicar versión»: publicar.yml)
name: Compilar app

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "tools/publicador/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    uses: ./.github/workflows/compilar.yml
