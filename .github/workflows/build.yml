# Compila Numpad Macros para Windows, Linux y macOS en los servidores de GitHub.
# Se ejecuta al subir cambios, a mano (pestaña Actions → "Run workflow"),
# o al crear una etiqueta v* (entonces publica una Release con los 3 archivos).
name: Compilar app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: NumpadMacros-Windows
          - os: ubuntu-22.04          # glibc antiguo: funciona en más distribuciones
            name: NumpadMacros-Linux
          - os: macos-14              # Apple Silicon
            name: NumpadMacros-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pillow   # pillow: convierte el icono

      - name: Pruebas
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Incluir interception.dll (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o icp.zip https://github.com/oblitum/Interception/releases/download/v1.0.1/Interception.zip
          unzip -q icp.zip -d icp
          cp icp/Interception/library/x64/interception.dll .
          mkdir -p third_party
          cp "icp/Interception/command line installer/install-interception.exe" third_party/
          cp "icp/Interception/licenses/non-commercial-usage/LGPL 3.0.txt" third_party/LGPL-3.0.txt

      - name: Compilar
        shell: bash
        run: pyinstaller --noconfirm NumpadMacros.spec

      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import npm; print(npm.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer\NumpadMacros.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "dist-installer\NumpadMacros-Setup-$version.exe" "NumpadMacros-Windows-Setup.exe"
          # versión portátil (sin instalar), por si alguien la prefiere
          Copy-Item LEEME.md dist/NumpadMacros/
          Compress-Archive -Path dist/NumpadMacros -DestinationPath "${{ matrix.name }}-portable.zip"

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/NumpadMacros
          cp dist/NumpadMacros instalar_linux.sh permisos_linux.sh LEEME.md assets/icon.png pkg/NumpadMacros/
          chmod +x pkg/NumpadMacros/*.sh pkg/NumpadMacros/NumpadMacros
          tar -C pkg -czf "${{ matrix.name }}.tar.gz" NumpadMacros

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "dist/Numpad Macros.app"
          ditto -c -k --keepParent "dist/Numpad Macros.app" "${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}-portable.zip
            ${{ matrix.name }}-Setup.exe
            ${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notas de la versión (desde CHANGELOG.md)
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notas.md
          cat >> notas.md <<'TXT'

          ### Descargas
          | Sistema | Archivo |
          |---|---|
          | Windows 10/11 (instalador) | `NumpadMacros-Windows-Setup.exe` |
          | Windows (portátil) | `NumpadMacros-Windows-portable.zip` |
          | Linux | `NumpadMacros-Linux.tar.gz` |
          | macOS | `NumpadMacros-macOS.zip` |

          Guía de instalación: [README](https://github.com/OkumaWsX/NumpadMacros#instalación)
          TXT
          sed -i 's/^          //' notas.md
          cat notas.md

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Numpad Macros ${{ github.ref_name }}
          body_path: notas.md
          files: out/*
